
name: Hybrid Framework

on:
  push:
    branches: [ "QA" ]
  pull_request:
    branches: [ "QA" ]

  schedule:
    - cron: 05 11 * * *
    - cron: 12 11 * * *

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Execute Tests
      run: mvn clean test -P UI_testing -DbrowserName=edge -X


