
name: Hybrid Framework

on:
  push:
    branches: [ "QA" ]
  pull_request:
    branches: [ "QA" ]
  schedule:
    - cron: "28 11 * * *"
    - cron: "20 11 * * *"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Execute Tests
      run: mvn clean test -P API_testing


